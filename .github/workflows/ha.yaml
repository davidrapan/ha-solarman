name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
jobs:
  profiles:
    name: Offline Deye profile regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML==6.0.3
      - run: python -B tools/test_deye_profiles.py -v
  hassfest:
    name: with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    name: with hacs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
