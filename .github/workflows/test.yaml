name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    name: with pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests/ -q
