# SOFAR 4KTLM-G3: two MPPTs, single phase, non-hybrid.
# Tested with LSW3_15_270A_1.68. Complete aligned FC03 blocks are required.
# Faults are raw G3 bitfields. No inverter register writes are defined.
requests:
- start: 1024
  end: 1070
  code: 3
  count: 47
- start: 1152
  end: 1199
  code: 3
  count: 48
- start: 1408
  end: 1417
  code: 3
  count: 10
- start: 1664
  end: 1691
  code: 3
  count: 28
parameters:
- group: Solar
  items:
  - name: PV1 Power
    class: power
    state_class: measurement
    uom: W
    scale: 10
    rule: 1
    registers:
    - 1414
    icon: mdi:solar-power
  - name: PV2 Power
    class: power
    state_class: measurement
    uom: W
    scale: 10
    rule: 1
    registers:
    - 1417
    icon: mdi:solar-power
  - name: PV1 Voltage
    class: voltage
    state_class: measurement
    uom: V
    scale: 0.1
    rule: 1
    registers:
    - 1412
    icon: mdi:solar-power
  - name: PV2 Voltage
    class: voltage
    state_class: measurement
    uom: V
    scale: 0.1
    rule: 1
    registers:
    - 1415
    icon: mdi:solar-power
  - name: PV1 Current
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 1
    registers:
    - 1413
    icon: mdi:solar-power
  - name: PV2 Current
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 1
    registers:
    - 1416
    icon: mdi:solar-power
  - name: Daily Production
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.01
    rule: 3
    registers:
    - 1669
    - 1668
    icon: mdi:solar-power
  - name: Total Production
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 1671
    - 1670
    icon: mdi:solar-power
- group: Output
  items:
  - name: Output active power
    class: power
    state_class: measurement
    uom: W
    scale: 10
    rule: 2
    registers:
    - 1157
    icon: mdi:home-lightning-bolt
  - name: Output reactive power
    class: ''
    state_class: measurement
    uom: kVar
    scale: 0.01
    rule: 2
    registers:
    - 1158
    icon: mdi:home-lightning-bolt
  - name: Grid frequency
    class: frequency
    state_class: measurement
    uom: Hz
    scale: 0.01
    rule: 1
    registers:
    - 1156
    icon: mdi:home-lightning-bolt
  - name: L1 Voltage
    class: voltage
    state_class: measurement
    uom: V
    scale: 0.1
    rule: 1
    registers:
    - 1165
    icon: mdi:home-lightning-bolt
  - name: L1 Current
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 1
    registers:
    - 1166
    icon: mdi:home-lightning-bolt
- group: Inverter
  items:
  - name: Inverter status
    class: enum
    scale: 1
    rule: 1
    registers:
    - 1028
    lookup:
    - key: 0
      value: Stand-by
    - key: 1
      value: Self-checking
    - key: 2
      value: Normal
    - key: 3
      value: Emergency Power Supply
    - key: 4
      value: Recoverable Fault
    - key: 5
      value: Permanent Fault
    - key: 6
      value: Upgrade
    - key: 7
      value: Self-charging
    - key: 8
      value: SVG
    - key: 9
      value: PID
    icon: mdi:wrench
  - name: Inverter inner temperature
    class: temperature
    state_class: measurement
    uom: °C
    scale: 1
    rule: 2
    registers:
    - 1048
    icon: mdi:thermometer
  - name: Inverter radiator temperature
    class: temperature
    state_class: measurement
    uom: °C
    scale: 1
    rule: 2
    registers:
    - 1050
    icon: mdi:thermometer
- group: Fault bitfields
  items:
  - name: Fault 1
    scale: 1
    rule: 1
    registers:
    - 1029
    icon: mdi:wrench
  - name: Fault 2
    scale: 1
    rule: 1
    registers:
    - 1030
    icon: mdi:wrench
  - name: Fault 3
    scale: 1
    rule: 1
    registers:
    - 1031
    icon: mdi:wrench
  - name: Fault 4
    scale: 1
    rule: 1
    registers:
    - 1032
    icon: mdi:wrench
  - name: Fault 5
    scale: 1
    rule: 1
    registers:
    - 1033
    icon: mdi:wrench
  - name: Fault 6
    scale: 1
    rule: 1
    registers:
    - 1034
    icon: mdi:wrench
  - name: Fault 7
    scale: 1
    rule: 1
    registers:
    - 1035
    icon: mdi:wrench
  - name: Fault 8
    scale: 1
    rule: 1
    registers:
    - 1036
    icon: mdi:wrench
  - name: Fault 9
    scale: 1
    rule: 1
    registers:
    - 1037
    icon: mdi:wrench
  - name: Fault 10
    scale: 1
    rule: 1
    registers:
    - 1038
    icon: mdi:wrench
  - name: Fault 11
    scale: 1
    rule: 1
    registers:
    - 1039
    icon: mdi:wrench
  - name: Fault 12
    scale: 1
    rule: 1
    registers:
    - 1040
    icon: mdi:wrench
info:
  manufacturer: Sofar
  model: 4KTLM-G3
default:
  update_interval: 60
  code: 3
requests_fine_control: true
