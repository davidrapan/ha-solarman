#
# Solarman Smart Meter DDZY422-D2 (single phase, integrated LSW3 Wi-Fi logger)
#
# Registers: iGEN document HT-YF2018-0929-01 (function code 3, sign + magnitude values).
# The integrated logger answers V5 requests (tcp) with an acknowledge only: use the "at" transport
# (UDP 48899, logger in "Data collection" mode, cloud keeps working) or "modbus_rtu" (logger in
# "Transparency" mode, cloud off). See davidrapan/ha-solarman#187.
#

default:
  update_interval: 5
  digits: 3
  code: 3

parameters:
  - group: Variable Data 1
    items:
      - name: Voltage
        class: voltage
        uom: V
        scale: 0.1
        rule: 1
        registers: [0x0001]

      - name: Current
        class: current
        state_class: measurement
        uom: A
        scale: 0.001
        rule: 2
        magnitude: True
        registers: [0x0003, 0x0002]

      - name: Power
        class: power
        state_class: measurement
        uom: W
        scale: 1
        rule: 2
        magnitude: True
        registers: [0x0007, 0x0006]

      - name: Power Factor
        class: power_factor
        state_class: measurement
        scale: 0.001
        rule: 2
        magnitude: True
        registers: [0x000C]

      - name: Frequency
        class: frequency
        state_class: measurement
        uom: Hz
        scale: 0.01
        rule: 1
        registers: [0x000D]

  - group: Energy
    items:
      - name: Total Import Energy
        class: energy
        state_class: total_increasing
        uom: kWh
        scale: 0.01
        rule: 4
        registers: [0x000F, 0x000E]

      - name: Total Export Energy
        class: energy
        state_class: total_increasing
        uom: kWh
        scale: 0.01
        rule: 4
        registers: [0x0019, 0x0018]
