      - name: "Battery Operation Mode"
        platform: "select"
        rule: 1
        registers: [0x00D5]
        icon: mdi:battery
        lookup:
          - key: 0x0000
            value: Voltage
          - key: 0x0001
            value: Capacity
          - key: 0x0002
