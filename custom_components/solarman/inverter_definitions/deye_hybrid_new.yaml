        description: Program 6 Backup Mode (BU, V119 reg 279 bit 3)
        platform: "switch"
        rule: 1
        registers: [0x0117]
        value:
          bit: 3
        icon: mdi:battery-lock

      - name: "Program 6 CH Mode"
        description: Program 6 Charge Mode (CH, V119 reg 279 bit 4)
        platform: "switch"
        rule: 1
        registers: [0x0117]
        value:
          bit: 4
        icon: mdi:battery-charging

      - name: "Program 6 Sell"
        platform: "switch"
        rule: 1
        registers: [0x0117]
        value:
          bit: 6
        icon: mdi:cash-refund

      - name: Microinverter Export cut-off
        platform: "switch"
        rule: 1
        registers: [0x0118]
        value:
          bit: 0

      - name: Generator Peak shaving
        platform: "switch"
        rule: 1
        registers: [0x0118]
        value:
          bit: 4

      - name: Grid Peak shaving
        platform: "switch"
        rule: 1
        registers: [0x0118]
        value:
          bit: 8

      - name: Generator On-Grid
        description: On Grid always on
        name_lookup: io_mode_select
        enabled_lookup:
          io_mode_select: [Generator, SmartLoad]
        platform: "switch"
        rule: 1
        registers: [0x0118]
        value:
          bit: 12

      - name: "External Relay"
        description: External relay enable bit (V119 reg 280 bit 13)
        platform: "switch"
        rule: 1
        registers: [0x0118]
        value:
          bit: 13

      - name: "Lithium Battery Loss Fault"
        description: Report fault when lithium battery communication is lost (V119 reg 280 bit 14)
        platform: "switch"
        rule: 1
        registers: [0x0118]
        value:
          bit: 14

      - name: "DRM"
        description: Demand Response Mode (DRM) enable bit (V119 reg 280 bit 15)
        platform: "switch"
        rule: 1
        registers: [0x0118]
        value:
          bit: 15

      - name: "External CT Direction Auto-Detect"
        description: External CT sensor auto-detect direction enable (V119 reg 281)
        platform: switch
        rule: 1
        registers: [0x0119]

      - name: Off Grid
        description: Force off-grid operation bit (V119 reg 416)
        platform: switch
        rule: 1
        range:
          min: 0
          max: 1
        registers: [0x01A0]

      - name: Grid reconnection time
        platform: number
        uom: "s"
        rule: 1
        range:
          min: 10
          max: 300
        registers: [0x011A]

      - name: "Solar Arc Fault Mode"
        description: Solar Arc Fault mode (V119 reg 283)
        platform: "select"
        rule: 1
        registers: [0x011B]
        lookup:
          - key: 0
            value: "Closed"
          - key: 1
            value: "Open"
          - key: 2
            value: "Arc fault reset"

      - name: "Grid Mode"
        description: Grid standard selection (V119 reg 284)
        platform: "select"
        rule: 1
        registers: [0x011C]
        lookup:
          - key: 0
            value: "General Standard"
          - key: 1
            value: "UL1741 & IEEE1547"
          - key: 2
            value: "CPUC RULE21"
          - key: 3
            value: "SRD-UL1741"
          - key: 4
            value: "CEI 0-21"
          - key: 5
            value: "EN50549_CZ"
          - key: 6
            value: "AS4777_A"
          - key: 7
            value: "AS4777_B"
          - key: 8
            value: "AS4777_C"
          - key: 9
            value: "AS4777_NewZealand"
          - key: 10
            value: "VDE4105"
          - key: 11
            value: "OVE_Directive_R25"
          - key: 12
            value: "EN50549_CZ_PPDS_L16A"
          - key: 13
            value: "NRS097"
          - key: 14
            value: "G98"
          - key: 15
            value: "G99"
          - key: 16
            value: "EN50549_1"
          - key: 17
            value: "DEWA"
          - key: 18
            value: "Custom"
          - key: 19
            value: "RD1699"
          - key: 20
            value: "NBR16149"

      - name: Grid frequency
        platform: "select"
        rule: 1
        registers: [0x011D]
        lookup:
          - key: 0x0
            value: 50 Hz
          - key: 0x1
            value: 60 Hz

      - name: "Grid Type"
        description: Grid phase/voltage type configuration (V119 reg 286)
        platform: "select"
        rule: 1
        registers: [0x011E]
        lookup:
          - key: 0
            value: "Single-Phase"
          - key: 1
            value: "Split-Phase 120/240V"
          - key: 2
            value: "Three-Phase 208V 120deg"
          - key: 3
            value: "Single-Phase 120V"

      - name: "Grid voltage protection - high"
        platform: number
        class: "voltage"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x011F]
        configurable:
          mode: box
        range:
          min: 1000
          max: 2900

      - name: "Grid voltage protection - low"
        platform: number
        class: "voltage"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0120]
        configurable:
          mode: box
        range:
          min: 1000
          max: 2900

      - name: "Grid frequency protection - high"
        platform: number
        class: "frequency"
        uom: "Hz"
        scale: 0.01
        rule: 1
        registers: [0x0121]
        configurable:
          mode: box
        range:
          min: 4500
          max: 6500

      - name: "Grid frequency protection - low"
        platform: number
        class: "frequency"
        uom: "Hz"
        scale: 0.01
        rule: 1
        registers: [0x0122]
        configurable:
          mode: box
        range:
          min: 4500
          max: 6500

      - name: Generator Grid side
        description: The generator is connected to the grid input
        platform: "switch"
        rule: 1
        registers: [0x0123]

      - name: "Generator Peak shaving"
        platform: number
        class: "power"
        uom: "W"
        rule: 1
        registers: [0x0124]
        icon: "mdi:generator-stationary"
        range:
          min: 0
          max: 22000

      - name: "Grid Peak shaving"
        platform: number
        class: "power"
        uom: "W"
        rule: 1
        registers: [0x0125]
        icon: "mdi:transmission-tower"
        range:
          min: 0
          max: 22000

      - name: "SmartLoad Open Delay"
        description: SmartLoad open delay time (V119 reg 294)
        platform: number
        class: "duration"
        uom: "min"
        rule: 1
        registers: [0x0126]
        configurable:
          min: 1
          max: 120
          mode: box
        range:
          min: 1
          max: 120

      - name: "Output PF Value"
        description: Output Power Factor regulation (V119 reg 295)
        platform: number
        uom: "%"
        scale: 0.1
        rule: 1
        registers: [0x0127]
        configurable:
          min: 80
          max: 120
          step: 0.1
          mode: box
        range:
          min: 800
          max: 1200

      - name: "UPS Time"
        description: UPS switching time setting (V119 reg 311)
        platform: "select"
        rule: 1
        registers: [0x0137]
        lookup:
          - key: 0
            value: "Default"
          - key: 1
            value: "1s"

      - name: Battery BMS Type
        platform: select
        rule: 1
        registers: [0x0145]
        icon: "mdi:battery"
        lookup:
          - key: 0x0000
            value: "PYLON"
          - key: 0x0001
            value: "Tianbangda"
          - key: 0x0002
            value: "KOK"
          - key: 0x0003
            value: "Keith"
          - key: 0x0004
            value: "Toppai"
          - key: 0x0005
            value: "Peneng 485"
          - key: 0x0006
            value: "Jeris 485"
          - key: 0x0007
            value: "Sunwoda 485"
          - key: 0x0008
            value: "Xinrui 485"
          - key: 0x0009
            value: "Tianbangda 485"
          - key: 0x000A
            value: "Shenggao Electric CAN"

      - name: "Meter"
        description: Ex_Meter For CT (Meter 1 enable, V119 reg 326 bit 0)
        platform: "switch"
        rule: 1
        registers: [0x0146]
        value:
          bit: 0

      - name: "Meter Phase A"
        description: Meter A-phase selection (V119 reg 326 bit 1)
        platform: "switch"
        rule: 1
        registers: [0x0146]
        value:
          bit: 1

      - name: "Meter Phase B"
        description: Meter B-phase selection (V119 reg 326 bit 2)
        platform: "switch"
        rule: 1
        registers: [0x0146]
        value:
          bit: 2

      - name: "Meter Phase C"
        description: Meter C-phase selection (V119 reg 326 bit 3)
        platform: "switch"
        rule: 1
        registers: [0x0146]
        value:
          bit: 3

      - name: AC Coupling
        description: Couple inverters and batteries using AC lines (V119 reg 326 bits 6-7)
        platform: "select"
        rule: 1
        registers: [0x0146]
        display:
          mask: 0x00C0
        lookup:
          - key: 0
            value: Disabled
          - bit: 6
            value: Grid
          - bit: 7
            value: Load

      - name: "Meter Type"
        description: External smart meter model (V119 reg 326 bits 8-11)
        platform: "select"
        rule: 1
        registers: [0x0146]
        display:
          mask: 0x0F00
        lookup:
          - key: 0x0000
            value: "Disabled"
          - key: 0x0100
            value: "Eastron 3P SDM630"
          - key: 0x0200
            value: "CHNT 3P DTSU666"
          - key: 0x0300
            value: "Eastron 1P SDM230"
          - key: 0x0400
            value: "CHNT 1P DDSU666"

      - name: "Meter 2"
        description: External Meter 2 enable (V119 reg 326 bit 12)
        platform: "switch"
        rule: 1
        registers: [0x0146]
        value:
          bit: 12

      - name: "External CT Ratio"
        description: External CT transformation ratio (V119 reg 327)
        platform: number
        rule: 1
        registers: [0x0147]
        configurable:
          min: 200
          max: 8000
          step: 1
          mode: box
        range:
          min: 200
          max: 8000

      - name: "AC Couple Frequency High"
        description: On-grid side high frequency limit of AC Couple (V119 reg 329)
        platform: number
        class: "frequency"
        uom: "Hz"
        scale: 0.01
        rule: 1
        registers: [0x0149]
        configurable:
          min: 50
          max: 65
          step: 0.01
          mode: box
        range:
          min: 5000
          max: 6500

      - name: "Solar 1 Wind Input"
        description: Enable wind turbine input on Solar 1 (V119 reg 390)
        platform: "switch"
        rule: 1
        registers: [0x0186]
        icon: "mdi:wind-turbine"

      - name: "Solar 2 Wind Input"
        description: Enable wind turbine input on Solar 2 (V119 reg 391)
        platform: "switch"
        rule: 1
        registers: [0x0187]
        icon: "mdi:wind-turbine"

  - group: BMS
    update_interval: 60
    items:
      - name: "Battery BMS Charging Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x0138]

      - name: "Battery BMS Discharging Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x0139]

      - name: "Battery BMS Charging Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        rule: 1
        registers: [0x013A]
        icon: "mdi:current-dc"

      - name: "Battery BMS Discharging Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        rule: 1
        registers: [0x013B]
        icon: "mdi:current-dc"

      - name: "Battery BMS SOC"
        class: "battery"
        state_class: "measurement"
        uom: "%"
        rule: 1
        registers: [0x013C]
        icon: "mdi:battery"
        validation:
          min: 0
          max: 101

      - name: "Battery BMS Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x013D]

      - name: "Battery BMS Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        rule: 2
        registers: [0x013E]
        icon: "mdi:current-dc"

      - name: "Battery BMS Temperature"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 1
        offset: 1000
        registers: [0x013F]

      - name: "Battery BMS Max Charging Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        rule: 1
        registers: [0x0140]
        icon: "mdi:current-dc"

      - name: "Battery BMS Max Discharging Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        rule: 1
        registers: [0x0141]
        icon: "mdi:current-dc"

      - name: "Battery Alarm"
        platform: binary_sensor
        class: "problem"
        rule: 1
        registers: [0x0142]
        icon: "mdi:battery-alert"
        attributes: ["value"]

      - name: "Battery Fault"
        platform: binary_sensor
        class: "problem"
        rule: 1
        registers: [0x0143]
        icon: "mdi:battery-alert-variant"
        range:
          min: 0
          max: 65535
        attributes: ["value"]

      - name: "Battery BMS Other Symbol"
        class: "enum"
        rule: 1
        registers: [0x0144]
        icon: "mdi:battery-unknown"
        range:
          min: 0
          max: 65535
        lookup:
          - key: 0
            value: "OK"
          - bit: 0
            value: "Vacancy"
          - bit: 1
            value: "Force charge"
