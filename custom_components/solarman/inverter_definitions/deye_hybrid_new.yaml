        registers: [0x00A8]
        icon: "mdi:transmission-tower"

      - name: "Grid Power"
        l: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        scale: [1, 10, 10]
        registers: [0x00A9]
        icon: "mdi:transmission-tower"
        attributes: [inverse]

      - name: "External CT1 Current"
        l: 1
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x00A2]
        icon: "mdi:transmission-tower"

      - name: "External CT2 Current"
        l: 2
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x00A3]
        icon: "mdi:transmission-tower"

      - name: "External CT1 Power"
        l: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        scale: [1, 10, 10]
        registers: [0x00AA]
        icon: "mdi:transmission-tower"

      - name: "External CT2 Power"
        l: 2
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        scale: [1, 10, 10]
        registers: [0x00AB]
        icon: "mdi:transmission-tower"

      - name: "External Power"
        l: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        scale: [1, 10, 10]
        registers: [0x00AC]
        icon: "mdi:transmission-tower"

  - group: Load
    items:
      - name: "Load L1 Voltage"
        l: 1
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x009D]

      - name: "Load L2 Voltage"
        l: 2
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x009E]

      - name: "Load L1 Power"
        l: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        scale: [1, 10, 10]
        registers: [0x00B0]

      - name: "Load L2 Power"
        l: 2
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        scale: [1, 10, 10]
        registers: [0x00B1]

      - name: "Load Power"
        l: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        scale: [1, 10, 10]
        registers: [0x00B2]

      - name: "Load L1 Current"
        l: 1
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x00B3]

      - name: "Load L2 Current"
        l: 2
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x00B4]

      - name: "Load Frequency"
        l: 1
        state_class: "measurement"
        uom: "Hz"
        scale: 0.01
        rule: 1
        registers: [0x00C0]

      - name: "UPS L1 Power"
        description: Load-side UPS L1 power (V119 reg 117)
        l: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [0x0075]

      - name: "UPS L2 Power"
        description: Load-side UPS L2 power (V119 reg 118)
        l: 2
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [0x0076]

      - name: "UPS Power"
        description: Total UPS load power (V119 reg 119)
        l: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [0x0077]

      - name: "Generator"
        description: Generator ready
        name_lookup: "io_mode_select"
        update_interval: 30
        platform: "binary_sensor"
        device_class: power
        rule: 1
        registers: [0x00C3]
        bit: 8

      - name: "Gen/SmartLoad Relay Status"
        description: Gen/SmartLoad output relay status (V119 reg 195 bits 0-3)
        update_interval: 30
        class: "enum"
        rule: 1
        mask: 0x000F
        registers: [0x00C3]
        icon: "mdi:electric-switch"
        lookup:
          - key: 0
            value: "Off"
          - key: 1
            value: "On"
          - key: 2
            value: "Optical drive output on"
          - key: 3
            value: "Load shedding"

      - name: "Grid Relay Status"
        description: Grid relay status (V119 reg 195 bits 4-7)
        update_interval: 30
        class: "enum"
        rule: 1
        mask: 0x00F0
        registers: [0x00C3]
        icon: "mdi:transmission-tower"
        lookup:
          - key: 0x0000
            value: "Off"
          - key: 0x0010
            value: "Closed"
          - key: 0x0020
            value: "Grid non-working"

      - name: "Output Frequency"
        l: 1
        state_class: "measurement"
        uom: "Hz"
        scale: 0.01
        rule: 1
        registers: [0x00C1]

      - name: "Output L1 Voltage"
        l: 1
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x009A]
        icon: "mdi:transmission-tower"

      - name: "Output L2 Voltage"
        l: 2
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x009B]
        icon: "mdi:transmission-tower"

      - name: "Output Voltage"
        l: 2
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x009C]
        icon: "mdi:transmission-tower"

      - name: "Output L1 Current"
        l: 1
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x00A4]

      - name: "Output L2 Current"
        l: 2
        class: "current"
        uom: "A"
        scale: 0.01
        rule: 2
        registers: [0x00A5]

      - name: "Output L1 Power"
        l: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        registers: [0x00AD]

      - name: "Output L2 Power"
        l: 2
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        registers: [0x00AE]

      - name: "Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        registers: [0x00AF]
        validation:
          lookup: "device_rated_power_sensor"
          scale: 1.1
          invalidate_all:

      - name: "Power losses"
        description: Includes consumption of the inverter device itself as well AC/DC conversion losses
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        digits: 0
        uint: enforce
        sensors:
          - registers: [0x00BA]
          - registers: [0x00BB]
          - mppt: 3
            registers: [0x00BC]
          - mppt: 4
            registers: [0x00BD]
          - signed:
            registers: [0x00BE]
          - operator: subtract
            signed:
            registers: [0x00AF]

      - name: "DC Temperature"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 2
        offset: 1000
        registers: [0x005A]

      - name: "Temperature"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 2
        offset: 1000
        registers: [0x005B]

      - name: "Grid"
        update_interval: 30
        platform: "binary_sensor"
        device_class: power
        rule: 1
        registers: [0x00C2]
        icon: "mdi:transmission-tower"

      - name: "Generator Power"
        name_lookup: "io_mode_select"
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        registers: [0x00A6]

      - name: "Generator Voltage"
        name_lookup: "io_mode_select"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x00B5]

      - name: "Generator Frequency"
        name_lookup: "io_mode_select"
        state_class: "measurement"
        uom: "Hz"
        scale: 0.01
        rule: 1
        registers: [0x00C4]

  - group: Settings
    update_interval: 300
    items:
      - name: "Battery Control Mode"
        platform: "select"
        rule: 1
        registers: [0x00C8]
        icon: "mdi:battery"
        lookup:
          - key: 0x0000
            value: "Lead-Battery, four-stage charging method"
          - key: 0x0001
            value: "Lithium"

      - name: "Battery Equalization"
        platform: number
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x00C9]
        configurable:
          min: 38
          max: 61
          step: 0.1
          mode: box
        icon: "mdi:battery"
        range:
          min: 3800
          max: 6100

      - name: "Battery Absorption"
        platform: number
        class: "voltage"
        state_class: "measurement"
        uom: "V"
