#
# Deye | Hybrid Inverter (Protocol V119 Full)
#
# Reference:
#   Modbus RTU single phase (1P) V119
#   https://github.com/user-attachments/files/16597960/Deye.Modbus.protocol.V118.pdf
#
# Full register set including all V119 sensors, BMS entities, energy counters, and controls.
#

info:
  manufacturer: Deye
  model: SG0*LP1 (V119)

default:
  update_interval: 5
  digits: 6

parameters:
  - group: Info
    update_interval: 3600
    items:
      - name: "Device"
        class: "enum"
        rule: 1
        registers: [0x0000]
        icon: "mdi:information"
        lookup:
          - key: 0x0000
            value: "Unknown"
          - key: [0x0002, 0x0200]
            value: "String Inverter"
          - key: [0x0003, 0x0300]
            value: "Single-Phase Hybrid Inverter"
          - key: [0x0004, 0x0400]
            value: "Microinverter"
          - key: [0x0005, 0x0500]
            value: "LV 3-Phase Hybrid Inverter"
          - key: 0x0006
            value: "HV 3-Phase Hybrid Inverter"
          - key: [0x0007, 0x0600]
            value: "HV 3-Phase Inverter 6-15kw"
          - key: [0x0008, 0x0601]
            value: "HV 3-Phase Inverter 20-50kw"
          - key: 0x0103
            value: "Off-Grid Inverter"
          - key: 0x0104
            value: "Energy Storage System"
        attributes:
          [
            "Device Modbus Address",
            "Device Protocol Version",
            "Device Serial Number",
            "Device Rated Phase",
            "Device Chip Type",
            "Device Control Board Firmware Version",
            "Device Communication Board Firmware Version",
            "Device Rated Power",
            "Device MPPTs",
            "Device Phases",
            "Device Rated Grid Voltage",
            "AC Power Ratio",
          ]

      - name: "Device Modbus Address"
        attribute:
        rule: 1
        registers: [0x0001]

      - name: "Device Protocol Version"
        attribute:
        rule: 7
        remove: "0."
        registers: [0x0002]

      - name: "Device Serial Number"
        attribute:
        rule: 5
        registers: [0x0003, 0x0004, 0x0005, 0x0006, 0x0007]

      - name: "Device Rated Phase"
        attribute:
        class: "enum"
        rule: 1
        registers: [0x0008]
        lookup:
          - key: [0, 1, 2]
            value: "Single-Phase"
          - key: 3
            value: "Three-Phase"
          - key: 8
            value: "Single-Phase Storage"

      - name: "Device Chip Type"
        attribute:
        class: "enum"
        rule: 1
        mask: 0x000F
        registers: [0x0009]
        lookup:
          - key: 0x0000
            value: "Unknown"
          - key: 0x0001
            value: "AT32F403A"
          - key: 0x0002
            value: "SXX32F103"
          - key: 0x0003
            value: "GD32F103"
          - key: 0x0004
            value: "GD32F303"

      - name: "Device Control Board Firmware Version"
        attribute:
        rule: 7
        delimiter: ""
        registers: [0x000D, 0x000C, 0x000B]

      - name: "Device Communication Board Firmware Version"
        attribute:
        rule: 7
        hex:
        delimiter: ""
        registers: [0x000E, 0x000A]

      - name: "Device Rated Power"
        attribute:
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 0.1
        rule: 4
        registers: [0x0010, 0x0011]
        validation:
          min: 1
          max: 18000
          default: 18000

      - name: "Device MPPTs"
        attribute:
        rule: 1
        mask: 0x0F00
        divide: 256
        registers: [0x0012]
        range:
          min: 1
        validation:
          max: 12
          default: 2

      - name: "Device Phases"
        attribute:
        rule: 1
        mask: 0x000F
        registers: [0x0012]
        range:
          min: 1
        validation:
          max: 3
          default: 1

      - name: "Device Rated Grid Voltage"
        attribute:
        class: "enum"
        rule: 1
        registers: [0x0013]
        lookup:
          - key: 0x0000
            value: "127/220V"
          - key: 0x0001
            value: "220/380V"

      - name: "AC Power Ratio"
        attribute:
        rule: 1
        registers: [0x0036]

      - name: "Hardware Matching Voltage"
        description: Hardware voltage matching bitfield (V119 reg 53 bits 0-1)
        class: "enum"
        rule: 1
        mask: 0x0003
        registers: [0x0035]
        icon: "mdi:chip"
        lookup:
          - key: 0x0000
            value: "500V"
          - key: 0x0001
            value: "550V"
          - key: default
            value: "Custom"

      - name: "Hardware Matching PV Current"
        description: Hardware PV current matching bitfield (V119 reg 53 bits 2-3)
        class: "enum"
        rule: 1
        mask: 0x000C
        registers: [0x0035]
        icon: "mdi:chip"
        lookup:
          - key: 0x0000
            value: "10A"
          - key: 0x0004
            value: "12.5A"
          - key: default
            value: "Custom"

      - name: "Hardware Matching VAC Sensor"
        description: Hardware VAC sensor matching bitfield (V119 reg 53 bits 4-5)
        class: "enum"
        rule: 1
        mask: 0x0030
        registers: [0x0035]
        icon: "mdi:chip"
        lookup:
          - key: 0x0000
            value: "Default"
          - key: 0x0010
            value: "Type 1"
          - key: default
            value: "Custom"

  - group: Control
    update_interval: 5
    items:
      - name: "Remote Lock"
        description: Remote lock enable (0 = On, 2 = Off)
        platform: switch
        update_interval: 60
        rule: 1
        registers: [0x0014]
        value:
          on: 0x0000
          off: 0x0002
        icon: "mdi:lock"

      - name: "Self-check time"
        platform: number
        update_interval: 300
        uom: "s"
        rule: 1
        registers: [0x0015]
        range:
          min: 0
          max: 1000
          default: 0

      - name: "Date & Time"
        platform: datetime
        update_interval: 60
        rule: 8
        registers: [0x0016, 0x0017, 0x0018]

      - name: "ATS"
        description: Automatic Transfer Switch (ATS) Enable (V119 reg 28 bit 0)
        platform: switch
        update_interval: 30
        rule: 1
        registers: [0x001C]
        value:
          bit: 0
        icon: "mdi:electric-switch"

      - name: "ATS Status"
        description: Automatic Transfer Switch (ATS) relay status (V119 reg 28 bit 1, read-only)
        platform: binary_sensor
        update_interval: 30
        device_class: power
        rule: 1
        registers: [0x001C]
        bit: 1
        icon: "mdi:electric-switch-closed"

      - name: "Low Power Mode"
        description: Low power mode when battery is low (Low power mode < Low Batt, V119 reg 28 bit 2)
        platform: switch
        update_interval: 30
        rule: 1
        registers: [0x001C]
        value:
          bit: 2
        icon: "mdi:leaf"

      - name: "MPPT multi-point scanning"
        description: Find the MPP even when there are partial shading conditions on the solar panels (V119 reg 28 bit 5)
        platform: switch
        update_interval: 30
        rule: 1
        registers: [0x001C]
        value:
          bit: 5
        icon: "mdi:solar-power-variant"

      - name: "Low Noise Mode"
        description: Low Noise Mode enable (V119 reg 34)
        platform: switch
        update_interval: 30
        rule: 1
        registers: [0x0022]
        icon: "mdi:volume-off"

      - name: "Import Power Limiter"
        description: Import power limiter setting (V119 reg 36)
        platform: number
        update_interval: 60
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [0x0024]
        range:
          min: 0
          max: 65535
        icon: "mdi:transmission-tower-export"

      - name: "" # On/Off Switch (Empty name so the sensor has same name as the device, looks good! Can be used once per platform though)
        platform: switch
        update_interval: 30
        rule: 1
        registers: [0x002B]

      - name: "Battery Absorption Time"
        description: Battery absorption charge time 30 minutes enable (Absorption_ChargeTime, V119 reg 46)
        platform: switch
        update_interval: 60
        rule: 1
        registers: [0x002E]
        icon: "mdi:timer-cog-outline"

      - name: "BMS Lithium Protocol"
        description: BMS Lithium battery protocol ID (0-30, V119 reg 48)
        platform: number
        update_interval: 300
        rule: 1
        registers: [0x0030]
        configurable:
          min: 0
          max: 30
          step: 1
          mode: box
        range:
          min: 0
          max: 30
        icon: "mdi:battery-sync"

      - name: "Device State"
        class: "enum"
        update_interval: 10
        rule: 1
        registers: [0x003B]
        icon: "mdi:state-machine"
        range:
          min: 0
          max: 5
        lookup:
          - key: 0x0000
            value: "Standby"
          - key: 0x0001
            value: "Self-test"
          - key: 0x0002
            value: "Normal"
          - key: 0x0003
            value: "Alarm"
          - key: 0x0004
            value: "Fault"

      - name: "Device Alarm"
        class: "enum"
        rule: 3
        registers: [0x0065, 0x0066]
        icon: "mdi:alert-outline"
        attributes: ["value"]
        lookup:
          - key: 0
            value: "OK"
          - bit: 1
            value: "Fan failure"
          - bit: 2
            value: "Grid phase failure"
          - bit: 3
            value: "Meter communication failure"
          - bit: 30
            value: "Battery loss"
          - bit: 31
            value: "Parallel communication quality"
          - key: default
            value: Problem

      - name: "Device Fault"
        class: "enum"
        rule: 3
        registers: [0x0067, 0x0068, 0x0069, 0x006A]
        icon: "mdi:message-alert-outline"
        attributes: ["value"]
        lookup:
          - key: 0
            value: "OK"
          - bit: 0
            value: "F01 DC Inversed failure"
          - bit: 1
            value: "F02 DC Insulation failure"
          - bit: 2
            value: "F03 GFDI failure"
          - bit: 3
            value: "F04 GFDI Ground failure"
          - bit: 4
            value: "F05 EEPROM Read failure"
          - bit: 5
            value: "F06 EEPROM Write failure"
          - bit: 6
            value: "DC/DC Soft Start failure"
          - bit: 7
            value: "F08 GFDI Relay failure"
          - bit: 8
            value: "F09 IGBT failure"
          - bit: 9
            value: "Auxiliary power supply failure"
          - bit: 10
            value: "F11 AC MainContactor failure"
          - bit: 11
            value: "F12 AC SlaveContactor failure"
          - bit: 12
            value: "Working mode changed"
          - bit: 13
            value: "F14 DC OverCurr failure"
          - bit: 14
            value: "F15 AC OverCurr failure"
          - bit: 15
            value: "F16 GFCI failure"
          - bit: 16
            value: "F17 Tz COM OC fault"
          - bit: 17
            value: "AC Over-current failure"
          - bit: 18
            value: "Tz_Integ_Fault failure"
          - bit: 19
            value: "DC Over-current failure"
          - bit: 20
            value: "F21 Tz GFDI OC fault"
          - bit: 21
            value: "F22 Tz EmergStop fault"
          - bit: 22
            value: "AC current leakage failure"
          - bit: 23
            value: "F24 DC Insulation fault"
          - bit: 24
            value: "F25 DC Feedback fault"
          - bit: 25
            value: "F26 BusUnbalance fault"
          - bit: 26
            value: "F27 DC Insulation ISO fault"
          - bit: 27
            value: "F28 DCIOver M1 fault"
          - bit: 28
            value: "F29 Parallel Comm fault"
          - bit: 29
            value: "F30 AC MainContactor fault"
          - bit: 30
            value: "F31 Relay Short fault"
          - bit: 33
            value: "F34 AC Overload fault"
          - bit: 34
            value: "F35 AC NoUtility fault"
          - bit: 36
            value: "F37 DC SoftStart failure"
          - bit: 38
            value: "F39 DC OverCurr failure"
          - bit: 40
            value: "F41 Parallel System Stop"
          - bit: 41
            value: "F42 AC Line Low Voltage"
          - bit: 44
            value: "F45 AC UV OverVolt fault"
          - bit: 45
            value: "F46 AC VW OverVolt fault"
          - bit: 46
            value: "F47 AC OverFreq fault"
          - bit: 47
            value: "F48 AC UnderFreq fault"
          - bit: 54
            value: "F55 DC VoltHigh fault"
          - bit: 55
            value: "F56 DC VoltLow fault"
          - bit: 57
            value: "F58 BMS Communication fault"
          - bit: 61
            value: "F62 DRM fault"
          - bit: 62
            value: "F63 ARC fault"
          - bit: 63
            value: "Temperature is too high"
          - key: default
            value: Problem

  - group: PV
    update_interval: 5
    items:
      - name: "PV Power"
        alt: DC Power
        mppt: 1
        description: Combined power of all inputs
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        digits: 0
        sensors:
          - registers: [0x00BA]
          - registers: [0x00BB]
          - registers: [0x00BC]
          - registers: [0x00BD]
        validation:
          min: 0
          max: 36000
          invalidate_all:
        icon: "mdi:solar-power-variant"

      - name: "PV1 Voltage"
        alt: DC1 Voltage
        mppt: 1
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x006D]
        icon: "mdi:solar-power-variant"

      - name: "PV1 Current"
        alt: DC1 Current
        mppt: 1
        class: "current"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x006E]
        icon: "mdi:solar-power-variant"

      - name: "PV2 Voltage"
        alt: DC2 Voltage
        mppt: 2
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x006F]
        icon: "mdi:solar-power-variant"

      - name: "PV2 Current"
        alt: DC2 Current
        mppt: 2
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x0070]
        icon: "mdi:solar-power-variant"

      - name: "PV3 Voltage"
        alt: DC3 Voltage
        mppt: 3
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0071]
        icon: "mdi:solar-power-variant"

      - name: "PV3 Current"
        alt: DC3 Current
        mppt: 3
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x0072]
        icon: "mdi:solar-power-variant"

      - name: "PV4 Voltage"
        alt: DC4 Voltage
        mppt: 4
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0073]
        icon: "mdi:solar-power-variant"

      - name: "PV4 Current"
        alt: "DC4 Current"
        mppt: 4
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x0074]
        icon: "mdi:solar-power-variant"

      - name: "PV1 Power"
        alt: DC1 Power
        mppt: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [0x00BA]
        icon: "mdi:solar-power-variant"

      - name: "PV2 Power"
        alt: DC2 Power
        mppt: 2
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [0x00BB]
        icon: "mdi:solar-power-variant"

      - name: "PV3 Power"
        alt: DC3 Power
        mppt: 3
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [0x00BC]
        icon: "mdi:solar-power-variant"

      - name: "PV4 Power"
        alt: DC4 Power
        mppt: 4
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [0x00BD]
        icon: "mdi:solar-power-variant"

  - group: Meter
    update_interval: 30
    items:
      - name: "Today Energy"
        alt: Daily Energy
        friendly_name: Today's Energy
        class: "energy"
        state_class: "total"
        uom: "kWh"
        scale: 0.1
        rule: 2
        registers: [0x003C]

      - name: "Total Energy"
        class: "energy"
        state_class: "total"
        uom: "kWh"
        scale: 0.1
        rule: 4
        registers: [0x003F, 0x0040]

      - name: "Monthly Production"
        description: Monthly PV energy production (V119 reg 65)
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        rule: 1
        registers: [0x0041]
        icon: "mdi:solar-power"

      - name: "Monthly Load Consumption"
        description: Monthly load energy consumption (V119 reg 66)
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        rule: 1
        registers: [0x0042]

      - name: "Monthly Energy Export"
        description: Monthly energy exported to grid (V119 reg 67)
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        rule: 1
        registers: [0x0043]
        icon: "mdi:transmission-tower-import"

      - name: "Yearly Production"
        description: Yearly PV energy production (V119 reg 68-69)
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0044, 0x0045]
        icon: "mdi:solar-power"

      - name: "Today Battery Charge"
        friendly_name: Today's Battery Charge
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0046]
        icon: "mdi:battery-plus"

      - name: "Today Battery Discharge"
        friendly_name: Today's Battery Discharge
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0047]
        icon: "mdi:battery-minus"

      - name: "Total Battery Charge"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0048, 0x0049]
        icon: "mdi:battery-plus"
        validation:
          min: 0.1

      - name: "Total Battery Discharge"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x004A, 0x004B]
        icon: "mdi:battery-minus"
        validation:
          min: 0.1

      - name: Today Battery Life Cycles
        alt: Daily Battery Life Cycles
        friendly_name: Today's Battery Life Cycles
        description: Calculates today's battery life cycles based on today's charged amount
        state_class: "total_increasing"
        rule: 0
        digits: 2
        icon: "mdi:battery-sync"

      - name: "Total Battery Life Cycles"
        description: Calculates total battery life cycles based on total charged amount
        state_class: "total_increasing"
        rule: 0
        digits: 2
        icon: "mdi:battery-sync"
        validation:
          min: 0.1

      - name: Today Energy Import
        alt: Today Energy Bought
        friendly_name: Today's Energy Import
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x004C]
        icon: "mdi:transmission-tower-export"

      - name: Today Energy Export
        alt: Today Energy Sold
        friendly_name: Today's Energy Export
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x004D]
        icon: "mdi:transmission-tower-import"

      - name: Total Energy Import
        alt: Total Energy Bought
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x004E, 0x0050]
        icon: "mdi:transmission-tower-export"
        validation:
          min: 0.1

      - name: Total Energy Export
        alt: Total Energy Sold
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0051, 0x0052]
        icon: "mdi:transmission-tower-import"
        validation:
          min: 0.1

      - name: "Generator Daily Operating Time"
        description: Generator daily operating time (V119 reg 83)
        name_lookup: "io_mode_select"
        class: "duration"
        state_class: "total_increasing"
        uom: "h"
        scale: 0.1
        rule: 1
        registers: [0x0053]
        icon: "mdi:generator-stationary"

      - name: "Today Load Consumption"
        friendly_name: Today's Load Consumption
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0054]

      - name: "Total Load Consumption"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0055, 0x0056]
        validation:
          min: 0.1

      - name: "Yearly Load Consumption"
        description: Yearly load energy consumption (V119 reg 87-88)
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0057, 0x0058]

      - name: Generator Energy - today
        name_lookup: "io_mode_select"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x003E]

      - name: Generator Energy
        name_lookup: "io_mode_select"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x005C, 0x005F]
        validation:
          min: 0.1

      - name: "Today Production"
        friendly_name: Today's Production
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x006C]
        icon: "mdi:solar-power"
        validation:
          dev: 100
          invalidate_all:

      - name: "Total Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0060, 0x0061]
        icon: "mdi:solar-power"
        validation:
          min: 0.1
          dev: 100
          invalidate_all: 2

      - name: "Yearly Energy Export"
        description: Yearly energy exported to grid (V119 reg 98-99)
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0062, 0x0063]
        icon: "mdi:transmission-tower-import"

      - name: Today Losses
        alt: Daily Losses
        friendly_name: Today's Losses
        description: Includes today's consumption of the inverter device itself as well AC/DC conversion losses
        class: "energy"
        state_class: "total_increasing"
        ensure_increasing:
        uom: "kWh"
        rule: 1
        digits: 1
        scale: 0.1
        uint: enforce
        sensors:
          - registers: [0x004C]
          - registers: [0x006C]
          - registers: [0x003E]
            enabled_lookup:
              io_mode_select: [Generator, Microinverter]
          - registers: [0x0047]
          - operator: subtract
            registers: [0x004D]
          - operator: subtract
            registers: [0x0046]
          - operator: subtract
            registers: [0x0054]

      - name: Total Losses
        description: Includes total consumption of the inverter device itself as well AC/DC conversion losses
        class: "energy"
        state_class: "total_increasing"
        ensure_increasing:
        uom: "kWh"
        rule: 3
        digits: 1
        scale: 0.1
        uint: enforce
        sensors:
          - registers: [0x004E, 0x0050]
          - registers: [0x0060, 0x0061]
          - registers: [0x005C, 0x005F]
            enabled_lookup:
              io_mode_select: [Generator, Microinverter]
          - registers: [0x004A, 0x004B]
          - operator: subtract
            registers: [0x0051, 0x0052]
          - operator: subtract
            registers: [0x0048, 0x0049]
          - operator: subtract
            registers: [0x0055, 0x0056]
        validation:
          min: 1

  - group: Battery
    items:
      - name: "Battery Temperature"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 1
        offset: 1000
        registers: [0x00B6]

      - name: "Battery Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.01
        rule: 1
        registers: [0x00B7]

      - name: "Battery"
        class: "battery"
        state_class: "measurement"
        uom: "%"
        rule: 1
        registers: [0x00B8]
        range:
          min: 0
          max: 100
        validation:
          min: 0
          max: 101
        attributes:
          [
            "Battery Corrected Capacity",
            "Battery BMS SOC",
            "Battery BMS Current",
            "Battery BMS Voltage",
            "Battery BMS Temperature",
            "Battery BMS Other Symbol",
            "Battery BMS Charging Voltage",
            "Battery BMS Discharging Voltage",
            "Battery BMS Charging Current",
            "Battery BMS Discharging Current",
            "Battery BMS Max Charging Current",
            "Battery BMS Max Discharging Current",
          ]

      - name: "Battery SOH"
        description: Calculates state of health based on total charged amount
        state_class: "measurement"
        uom: "%"
        rule: 0
        digits: 2
        icon: "mdi:battery-heart"

      - name: "Battery State"
        description: Determines battery state from battery power by +-50 W
        class: "enum"
        rule: 0
        options: ["charging", "idle", "discharging"]
        icon: "mdi:battery"

      - name: "Battery Hardware Status"
        description: Raw inverter battery status register (V119 reg 185)
        class: "enum"
        rule: 1
        registers: [0x00B9]
        icon: "mdi:battery-sync"
        lookup:
          - key: 0
            value: "Charging"
          - key: 1
            value: "Standby"
          - key: 2
            value: "Discharging"

      - name: "Battery Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 2
        registers: [0x00BE]
        attributes: [inverse]

      - name: "Battery Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: [0.01, 0.01, 0.1]
        rule: 2
        registers: [0x00BF]
        icon: "mdi:current-dc"

      - name: "Battery Capacity"
        description: Estimates capacity of the battery during (dis)charging
        class: energy_storage
        state_class: measurement
        uom: "kWh"
        rule: 0
        digits: 1
        icon: "mdi:battery-check"

      - name: "Battery Corrected Capacity"
        state_class: "measurement"
        uom: "Ah"
        rule: 1
        registers: [0x006B]
        icon: "mdi:battery"
        range:
          min: 0
          max: 3000

